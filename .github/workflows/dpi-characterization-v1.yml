name: DPI Characterization V1

on:
  push:
    branches:
      - test/dpi-characterization-v1
  pull_request:
    paths:
      - 'scripts/characterization_v1.ps1'
      - 'demo/03_PRESENTAZIONE/console/dashboard_data.json'
      - 'demo/03_PRESENTAZIONE/console/pdf/**'
      - '.github/workflows/dpi-characterization-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run characterization suite
        shell: pwsh
        run: ./scripts/characterization_v1.ps1
