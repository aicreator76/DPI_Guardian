name: DPI Guardian 4C semantic fail-closed

on:
  push:
    branches:
      - fix/dpi-4c-semantic-failclosed
  pull_request:
    paths:
      - demo/04_SCRIPT/DPI_GUARDIAN_RUN.ps1
      - tests/dpi-4c-realinput-failclosed.ps1
      - .github/workflows/dpi-4c-realinput-failclosed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run DPI 4C semantic fail-closed tests
        shell: pwsh
        run: ./tests/dpi-4c-realinput-failclosed.ps1
